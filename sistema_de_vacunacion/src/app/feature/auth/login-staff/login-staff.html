<div class="login-page">
  <div class="login-header">
    <h1>Acceso del Personal</h1>
    <p>Ingresa tu usuario y contraseña para continuar</p>
  </div>

  <div class="login-card">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label for="usuario">Usuario</label>
        <input
          id="usuario"
          type="text"
          formControlName="usuario"
          placeholder="Correo o número de documento"
          autocomplete="username"
        />
        <span class="field-error" *ngIf="f['usuario'].touched && f['usuario'].invalid">
          Ingresa tu usuario.
        </span>
      </div>

      <div class="form-group">
        <label for="contrasena">Contraseña</label>
        <div class="password-wrapper">
          <input
            id="contrasena"
            [type]="mostrarContrasena() ? 'text' : 'password'"
            formControlName="contrasena"
            placeholder="Ingresa tu contraseña"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="alternarVisibilidadContrasena()"
            [attr.aria-label]="mostrarContrasena() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            <i class="bi" [ngClass]="mostrarContrasena() ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
        <span class="field-error" *ngIf="f['contrasena'].touched && f['contrasena'].invalid">
          Ingresa tu contraseña.
        </span>
      </div>

      <div class="alert-error" *ngIf="mensajeError()">{{ mensajeError() }}</div>

      <button type="submit" class="btn-submit" [disabled]="cargando()">
        {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
