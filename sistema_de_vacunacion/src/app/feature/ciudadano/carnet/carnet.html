<section class="carnet">

  <h1>Mi carnet</h1>
  <p class="subtitulo">Descarga del carnet digital en PDF</p>

  @if (ciudadano(); as datos) {

    <div class="carnet-card">

      <div class="avatar">
        <i class="bi bi-person-circle"></i>
      </div>

      <div class="info">

        <h2>{{ datos.nombre }} {{ datos.apellido }}</h2>

        <p>
          Documento {{ datos.numeroDocumento }}
        </p>

      </div>

    </div>

    <button class="btn-descargar" type ="button" (click)="descargarCarnet()" [disabled]="descargando()">
      <i class="bi bi-download"></i>
      {{ descargando()
          ? 'Generando...'
          : 'Descargar'
      }}
    </button>

  }

</section>
